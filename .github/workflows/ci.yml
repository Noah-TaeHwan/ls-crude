name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Candidate ledger contract
        run: |
          python scripts/sync_candidate_ledger.py --self-test
          python scripts/sync_candidate_ledger.py --check
          python scripts/export_observation_charts.py --check
          python notebooks/ALT-20260907-45/collect.py --self-test
          python notebooks/ALT-20260907-02/collect.py --self-test
          python notebooks/ALT-20260907-36/collect.py --self-test
          python notebooks/ALT-20260907-43/collect.py --self-test
      - name: Install and test
        run: |
          pip install -r requirements.txt
          pip install -e .
          pytest

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck
        run: |
          npm install
          npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: node --test tests/defcon-sample.test.mjs tests/deployment-cwd.test.mjs tests/visibility.test.mjs tests/tanker-arrivals.test.mjs tests/wti-chart-axis.test.mjs tests/research-charts.test.mjs tests/empties.test.mjs tests/cushing-context.test.mjs tests/cai-view.test.mjs tests/cai-components.test.mjs tests/cai-history.test.mjs tests/cai-legacy-links.test.mjs tests/cai-home.test.mjs tests/cai-research.test.mjs tests/cai-history-ledger.test.mjs
