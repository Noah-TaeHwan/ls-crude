name: prune-extra-branches

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: branches } = await github.rest.repos.listBranches({
              owner,
              repo,
              per_page: 100,
            });
            for (const branch of branches) {
              if (branch.name === "main" || branch.protected) {
                continue;
              }
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`,
              });
              core.info(`deleted ${branch.name}`);
            }
            const workflowPath = ".github/workflows/prune-extra-branches.yml";
            try {
              const file = await github.rest.repos.getContent({
                owner,
                repo,
                path: workflowPath,
                ref: "main",
              });
              const sha = Array.isArray(file.data) ? null : file.data.sha;
              if (sha) {
                await github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path: workflowPath,
                  message: "Remove one-shot extra-branch prune workflow",
                  sha,
                  branch: "main",
                });
              }
            } catch (error) {
              core.warning(`could not remove prune workflow: ${error.message}`);
            }
