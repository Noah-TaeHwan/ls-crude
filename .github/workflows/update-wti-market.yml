name: update-wti-market

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-wti-market
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Generate WTI market snapshot
        working-directory: research
        run: |
          pip install -r requirements.txt
          pip install -e .
          python -m ls_crude.market_snapshot

      - name: Verify research
        working-directory: research
        run: pytest

      - name: Verify app
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Upload validated snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wti-market-snapshot
          path: app/public/wti-market-snapshot.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wti-market-snapshot
          path: generated

      - name: Stage validated snapshot
        run: cp generated/wti-market-snapshot.json app/public/wti-market-snapshot.json

      - name: Detect snapshot change
        id: change
        run: |
          if git diff --quiet -- app/public/wti-market-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open data-only pull request
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/wti-market-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pr_url=""
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 ]]; then
              if [[ -n "$pr_url" ]]; then
                gh pr close "$pr_url" --delete-branch || true
              fi
              if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
                git push origin --delete "$branch" || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main advanced after validation; a later run must regenerate the snapshot." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- app/public/wti-market-snapshot.json
          test "$(git diff --cached --name-only)" = "app/public/wti-market-snapshot.json"
          git commit -m "chore: WTI 시장 관측값을 갱신한다"
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "chore: WTI 시장 관측값 갱신" --body "Yahoo Finance CL=F의 최근 완료 일봉으로 생성한 데이터 파일만 갱신합니다.")"
          gh pr merge "$pr_url" --squash --delete-branch --match-head-commit "$(git rev-parse HEAD)"
          trap - EXIT

  notify:
    needs: [validate, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open failure issue (one per day)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="wti-market automation failed $(date -u +%F)"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json title --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. 화면에는 '업데이트 지연' 뱃지가 뜰 수 있음."
          fi
