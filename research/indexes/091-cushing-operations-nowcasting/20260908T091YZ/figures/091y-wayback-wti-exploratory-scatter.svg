<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">Exploratory Cushing Maverik price versus WTI scatter</title><desc id="desc">Five irregular archival snapshots of Maverik Cushing prices paired to most recent EIA WTI. Gasoline Pearson correlation is 0.973 and diesel is 0.952 but the sample size is only five, it has no forward lead test, and observations are irregular.</desc><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16213a}.t{font-size:25px;font-weight:700}.s{font-size:14px;fill:#53657b}.axis{stroke:#65758a;stroke-width:1.5}.grid{stroke:#dfe6ef;stroke-width:1}.lab{font-size:13px}.note{font-size:12px;fill:#53657b}.gas{fill:#3f8ac5}.diesel{fill:#cf873b}</style><rect width="980" height="470" fill="#fbfcff"/><text x="40" y="42" class="t">Maverik Cushing pump price × EIA WTI — exploratory archive sample</text><text x="40" y="66" class="s">Five irregular page snapshots; same-date/previous-business-day matching only. This is not a lead-lag result.</text><line x1="110" y1="390" x2="890" y2="390" class="axis"/><line x1="110" y1="95" x2="110" y2="390" class="axis"/><line x1="110" y1="331" x2="890" y2="331" class="grid"/><line x1="110" y1="272" x2="890" y2="272" class="grid"/><line x1="110" y1="213" x2="890" y2="213" class="grid"/><line x1="110" y1="154" x2="890" y2="154" class="grid"/><text x="94" y="394" class="lab">0</text><text x="80" y="335" class="lab">1</text><text x="80" y="276" class="lab">2</text><text x="80" y="217" class="lab">3</text><text x="80" y="158" class="lab">4</text><text x="55" y="112" class="lab">$/gal</text><text x="190" y="415" class="lab">55</text><text x="345" y="415" class="lab">65</text><text x="500" y="415" class="lab">75</text><text x="655" y="415" class="lab">85</text><text x="810" y="415" class="lab">95</text><text x="760" y="443" class="lab">WTI $/bbl</text><circle cx="267" cy="222" r="7" class="gas"/><circle cx="163" cy="234" r="7" class="gas"/><circle cx="153" cy="237" r="7" class="gas"/><circle cx="779" cy="184" r="7" class="gas"/><circle cx="755" cy="166" r="7" class="gas"/><circle cx="267" cy="184" r="7" class="diesel"/><circle cx="163" cy="174" r="7" class="diesel"/><circle cx="153" cy="178" r="7" class="diesel"/><circle cx="779" cy="95" r="7" class="diesel"/><circle cx="755" cy="95" r="7" class="diesel"/><rect x="520" y="92" width="365" height="74" rx="8" fill="#eef4fa" stroke="#b7c9dc"/><text x="540" y="118" class="lab">Regular: Pearson r = +0.973, p = .005, n = 5</text><text x="540" y="140" class="lab">Diesel: Pearson r = +0.952, p = .013, n = 5</text><text x="540" y="158" class="note">Irregular archive selection invalidates inference.</text><circle cx="115" cy="447" r="6" class="gas"/><text x="127" y="451" class="lab">Regular</text><circle cx="215" cy="447" r="6" class="diesel"/><text x="227" y="451" class="lab">Diesel</text></svg>
