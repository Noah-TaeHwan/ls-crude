<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-label="CFAM rail waste diesel feasibility board">
  <style>text{font-family:Arial,sans-serif;fill:#19212b}.title{font-size:24px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px}.tag{font-size:18px;font-weight:700;fill:#fff}</style>
  <rect width="1080" height="300" fill="#f7f8fa"/>
  <text x="35" y="42" class="title">CFAM: three proposed traces — what is observable today?</text>
  <rect x="35" y="70" width="320" height="185" rx="14" fill="#fff" stroke="#d2d7df"/><rect x="35" y="70" width="320" height="43" rx="14" fill="#7a4d00"/><text x="55" y="98" class="tag">091-RAIL · PARK</text><text x="55" y="143" class="head">Regional rail context only</text><text x="55" y="169" class="body">No free dated tank-car count at</text><text x="55" y="190" class="body">Cushing/Stroud transfer facilities.</text><text x="55" y="222" class="body">Next: 60 monthly throughput/count rows.</text>
  <rect x="380" y="70" width="320" height="185" rx="14" fill="#fff" stroke="#d2d7df"/><rect x="380" y="70" width="320" height="43" rx="14" fill="#7a4d00"/><text x="400" y="98" class="tag">091-WASTE · PARK</text><text x="400" y="143" class="head">Form available, data unverified</text><text x="400" y="169" class="body">DEQ monthly form exists; no public</text><text x="400" y="190" class="body">Cushing facility-tonnage panel found.</text><text x="400" y="222" class="body">Next: 60 dated facility reporting rows.</text>
  <rect x="725" y="70" width="320" height="185" rx="14" fill="#fff" stroke="#d2d7df"/><rect x="725" y="70" width="320" height="43" rx="14" fill="#167448"/><text x="745" y="98" class="tag">091-YD · FORWARD ONLY</text><text x="745" y="143" class="head">Live local price differential</text><text x="745" y="169" class="body">Displayed diesel − regular gasoline.</text><text x="745" y="190" class="body">Measures price stress, not truck volume.</text><text x="745" y="222" class="body">Next: frozen 90-day weekly panel.</text>
</svg>
