<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">091-W Cushing air-observation feasibility gate</title>
  <desc id="desc">Four public air-quality routes are evaluated. AirCasting has zero public Cushing sessions, DEQ has no Cushing continuous site, IQAir raw export is not reproducible, and annual emissions are too slow. The current result is park, no numeric air signal.</desc>
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.s{font-size:14px;fill:#52607a}.l{font-size:16px;font-weight:700}.b{font-size:14px}.ok{fill:#e9eef6;stroke:#aab7cb}.no{fill:#feeceb;stroke:#e58b86}.park{fill:#fff6d9;stroke:#d8ad48}.badge{font-size:14px;font-weight:700}.small{font-size:12px;fill:#52607a}</style>
  <rect width="980" height="430" fill="#fbfcff"/>
  <text x="40" y="45" class="h">091-W · Cushing air-activity data gate</text>
  <text x="40" y="70" class="s">Question: can a public, repeated local pollution measure observe current Cushing field activity?</text>
  <rect x="40" y="105" width="210" height="160" rx="10" class="no"/><text x="60" y="138" class="l">AirCasting</text><text x="60" y="165" class="b">PM2.5 public sessions: 0</text><text x="60" y="190" class="small">6 sensor-name variants</text><text x="60" y="210" class="small">2024-01 → 2026-09</text><text x="60" y="238" class="badge">FAIL · no local series</text>
  <rect x="275" y="105" width="210" height="160" rx="10" class="no"/><text x="295" y="138" class="l">Oklahoma DEQ</text><text x="295" y="165" class="b">Current Cushing site: 0</text><text x="295" y="190" class="small">State network is official,</text><text x="295" y="210" class="small">but not Cushing-continuous</text><text x="295" y="238" class="badge">FAIL · no local monitor</text>
  <rect x="510" y="105" width="210" height="160" rx="10" class="no"/><text x="530" y="138" class="l">IQAir map</text><text x="530" y="165" class="b">Station/export: unverified</text><text x="530" y="190" class="small">Page access checkpointed;</text><text x="530" y="210" class="small">no reproducible raw panel</text><text x="530" y="238" class="badge">FAIL · not auditable</text>
  <rect x="745" y="105" width="195" height="160" rx="10" class="park"/><text x="765" y="138" class="l">DEQ annual inventory</text><text x="765" y="165" class="b">Facility emissions</text><text x="765" y="190" class="small">Annual, reported late;</text><text x="765" y="210" class="small">structural context only</text><text x="765" y="238" class="badge">PARK · no nowcast</text>
  <path d="M490 291 L490 328" stroke="#52607a" stroke-width="2"/><path d="M482 320 L490 330 L498 320" fill="none" stroke="#52607a" stroke-width="2"/>
  <rect x="250" y="337" width="480" height="62" rx="10" class="ok"/><text x="277" y="364" class="l">Current decision: do not compute an air-quality score</text><text x="277" y="386" class="s">Keep only an environmental-disruption candidate, pending a fixed Cushing monitor with an exportable history.</text>
</svg>
