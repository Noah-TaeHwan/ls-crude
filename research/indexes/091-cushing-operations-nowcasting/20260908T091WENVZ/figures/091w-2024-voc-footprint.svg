<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
<title id="title">2024 Cushing terminal-like facility VOC footprint</title><desc id="desc">Horizontal bar chart of the ten largest 2024 reported VOC totals among operating Cushing facilities whose names contain terminal, tank farm or crude. Plains Cushing Terminal is 354.724 tons and Enbridge Cushing Terminal 244.413 tons. The total for 17 filtered records is 1206.389 tons.</desc>
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#14213d}.t{font-size:25px;font-weight:700}.s{font-size:14px;fill:#53657b}.l{font-size:14px}.v{font-size:13px;font-weight:700}.g{stroke:#dfe6ef;stroke-width:1}.bar{fill:#3d82c4}.note{font-size:12px;fill:#53657b}</style><rect width="980" height="560" fill="#fbfcff"/>
<text x="40" y="42" class="t">Cushing annual environmental footprint · 2024 reported VOC</text><text x="40" y="66" class="s">17 operating Cushing-city facilities with terminal / tank farm / crude in the facility name · annual reported tons, not real-time air quality</text>
<line x1="360" y1="96" x2="360" y2="465" class="g"/><line x1="500" y1="96" x2="500" y2="465" class="g"/><line x1="640" y1="96" x2="640" y2="465" class="g"/><line x1="780" y1="96" x2="780" y2="465" class="g"/><line x1="920" y1="96" x2="920" y2="465" class="g"/>
<text x="355" y="88" class="note">0</text><text x="487" y="88" class="note">100</text><text x="627" y="88" class="note">200</text><text x="767" y="88" class="note">300</text><text x="902" y="88" class="note">400 tons</text>
