<svg xmlns="http://www.w3.org/2000/svg" width="540" height="285" viewBox="0 0 540 285">
  <rect width="540" height="285" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">ODOT AVC 40 — collected public receipt</text>
  <text x="28" y="56" font-family="Arial, sans-serif" font-size="11" fill="#556070">Payne County AADT map, 2023. AVC denotes daily volume and vehicle-classification recording.</text>
  <line x1="74" y1="225" x2="490" y2="225" stroke="#8fa0b3" stroke-width="2"/>
  <rect x="210" y="83" width="140" height="142" rx="5" fill="#1f6f8b"/>
  <text x="280" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">AVC 40</text>
  <text x="280" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">6,178</text>
  <text x="280" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">vehicles / day</text>
  <text x="280" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#556070">One annual observation — not a traffic trend or a test result</text>
</svg>
