<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
<title id="title">091-X Cushing flow-pressure spread source gate</title><desc id="desc">Cushing WTI has a public daily EIA source. Houston and Midland values are valid market concepts but no reproducible free long history was collected. The output is a park decision and no spread calculation.</desc>
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16213a}.t{font-size:25px;font-weight:700}.s{font-size:14px;fill:#53657b}.h{font-size:17px;font-weight:700}.b{font-size:14px}.yes{fill:#e7f5ec;stroke:#77b68e}.no{fill:#feeceb;stroke:#e28a85}.park{fill:#fff5d9;stroke:#d5ad4b}.small{font-size:12px;fill:#53657b}</style><rect width="980" height="420" fill="#fbfcff"/>
<text x="40" y="43" class="t">091-X · Cushing–Houston/Midland Flow Pressure</text><text x="40" y="67" class="s">A spread is valid only when both daily legs use matched, reproducible price definitions.</text>
<rect x="40" y="105" width="270" height="150" rx="10" class="yes"/><text x="60" y="140" class="h">WTI Cushing</text><text x="60" y="169" class="b">EIA RWTC daily spot FOB</text><text x="60" y="195" class="small">Direct public API · long history</text><text x="60" y="226" class="h">PASS</text>
<text x="326" y="187" class="h">minus / plus</text>
<rect x="440" y="105" width="220" height="150" rx="10" class="no"/><text x="460" y="140" class="h">WTI Houston / MEH</text><text x="460" y="169" class="b">Valid physical benchmark</text><text x="460" y="195" class="small">No free paired history</text><text x="460" y="226" class="h">FAIL</text>
<rect x="700" y="105" width="220" height="150" rx="10" class="no"/><text x="720" y="140" class="h">WTI Midland</text><text x="720" y="169" class="b">Valid physical benchmark</text><text x="720" y="195" class="small">No free paired history</text><text x="720" y="226" class="h">FAIL</text>
<path d="M490 274 L490 304" stroke="#53657b" stroke-width="2"/><path d="M482 296 L490 306 L498 296" fill="none" stroke="#53657b" stroke-width="2"/>
<rect x="220" y="314" width="540" height="64" rx="10" class="park"/><text x="248" y="342" class="h">Current decision: PARK — do not calculate a pseudo-spread</text><text x="248" y="365" class="s">Brent–WTI is an export-arbitrage proxy, not Houston/Midland; it is not silently substituted.</text>
</svg>
